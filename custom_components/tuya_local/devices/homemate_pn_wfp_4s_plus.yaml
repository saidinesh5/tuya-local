# Master switch
  - entity: switch
    icon: "mdi:toggle-switch"
    name: Main switch
    dps:
      - id: 13
        type: boolean
        name: switch

# Timers for switches
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "1"
    hidden: unavailable
    dps:
      - id: 7
        type: integer
        name: second
        optional: true
        range:
          min: 0
          max: 86400
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "2"
    hidden: unavailable
    dps:
      - id: 8
        type: integer
        name: second
        optional: true
        range:
          min: 0
          max: 86400
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "3"
    hidden: unavailable
