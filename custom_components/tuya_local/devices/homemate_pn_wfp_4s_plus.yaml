name: HomeMate 4 Gang Multi Switch (PN-WFP-4S+)
products:
  - id: t9nuk3vjfsojiusj
    manufacturer: HomeMate
    model: PN-WFP-4S+
entities:
# Switches
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "1"
    dps:
      - id: 1
        name: switch
        type: boolean
        optional: true
      - id: 1
        name: available
        type: boolean
        optional: true
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "2"
    dps:
      - id: 2
        name: switch
        type: boolean
        optional: true
      - id: 2
        name: available
        type: boolean
        optional: true
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "3"
    hidden: unavailable
    dps:
      - id: 3
        name: switch
        type: boolean
        optional: true
      - id: 3
        name: available
        type: boolean
        optional: true
        mapping:
          - dps_val: null
            value: false
