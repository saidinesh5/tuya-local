# Settings
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 14
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "power_off"
            value: "power_off"
          - dps_val: "power_on"
            value: "power_on"
          - dps_val: "last"
            value: "last"
  - entity: select
    translation_key: backlight_on_color
    name: Backlight On Color
    category: config
    dps:
      - id: 131
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: Red
            value: Red
          - dps_val: Blue
            value: Blue
          - dps_val: White
            value: White
          - dps_val: None
            value: None
  - entity: select
    translation_key: backlight_off_color
    name: Backlight Off Color
    category: config
    dps:
